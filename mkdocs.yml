site_name: Inżynieria dronowa
site_description: Kurs ESP32-C6 i Arduino dla Uniwersytetu Dzieci – od mrugania diodą do drona, który sam trzyma wysokość
site_url: https://onikw.github.io/dron-ud/
repo_url: https://github.com/onikw/dron-ud
repo_name: onikw/dron-ud
edit_uri: blob/main/kurs/
copyright: 'Autor: Wiktor Onik'

docs_dir: kurs

theme:
  name: material
  language: pl
  font:
    text: Outfit
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Przełącz na tryb ciemny
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Przełącz na tryb jasny

plugins:
  - search
  - callouts

nav:
  - Start:
      - Mapa kursu: index.md
      - "Krok 1: Instalacja": start/instalacja.md
      - "Krok 2: Nasz dron": start/dron.md
      - Najczęstsze problemy: start/problemy.md

  - "Zajęcia 3: Arduino i silniki":
      - Przegląd: zajecia3/index.md
      - "L01: Miganie diodą": zajecia3/l01_miganie.md
      - "L02: PWM i dioda": zajecia3/l02_pwm_led.md
      - "L03: Jeden silnik": zajecia3/l03_jeden_silnik.md
      - "L04: Cztery silniki": zajecia3/l04_cztery_silniki.md
      - "L05: Skaner I2C": zajecia3/l05_skaner_i2c.md

  - "Zajęcia 4: Utrzymanie wysokości":
      - Przegląd: zajecia4/index.md
      - "L06: MPU6050 (dodatkowa)": zajecia4/l06_mpu6050.md
      - "L07: Laser": zajecia4/l07_laser.md
      - "L08: Filtr": zajecia4/l08_filtr.md
      - "L09: Trzymaj wysokość": zajecia4/l09_trzymaj_wysokosc.md

  - "Zajęcia 5: Zawody":
      - "L10: Misja": zajecia5/l10_misja.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - javascripts/external_links.js

extra_css:
  - stylesheets/custom.css
